data_science:
  # Variable objetivo: "Item_Units" (unidades = ventas / precio) o "Item_Outlet_Sales" (Q).
  target: Item_Units
  features_numericas:
    - Item_Weight
    - Item_Visibility
    - Item_MRP
    - Outlet_Age
  features_categoricas:
    - Item_Category
    - Item_Fat_Content
    - Item_Type
    - Outlet_Identifier
    - Outlet_Size
    - Outlet_Location_Type
    - Outlet_Type
  # Columna usada por la línea base (promedio del objetivo por grupo).
  baseline_grupo: Outlet_Type
  test_size: 0.2
  random_state: 42
  modelo:
    n_estimators: 300
    max_depth: 8
    min_samples_leaf: 30
