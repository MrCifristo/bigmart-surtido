# Data Catalog del proyecto BigMart.
# Documentación: https://docs.kedro.org/en/stable/catalog-data/introduction/

# --- 01 raw ---------------------------------------------------------------
bigmart_raw:
  type: pandas.CSVDataset
  filepath: data/01_raw/bigmart.csv

# --- 02 intermediate ------------------------------------------------------
bigmart_normalizado:
  type: pandas.CSVDataset
  filepath: data/02_intermediate/bigmart_normalizado.csv

# --- 03 primary -----------------------------------------------------------
bigmart_limpio:
  type: pandas.CSVDataset
  filepath: data/03_primary/bigmart_limpio.csv

reporte_calidad_datos:
  type: json.JSONDataset
  filepath: data/08_reporting/reporte_calidad_datos.json

# --- 04 feature -----------------------------------------------------------
bigmart_features:
  type: pandas.CSVDataset
  filepath: data/04_feature/bigmart_features.csv

# --- 05 model input -------------------------------------------------------
X_train:
  type: pandas.CSVDataset
  filepath: data/05_model_input/X_train.csv

X_test:
  type: pandas.CSVDataset
  filepath: data/05_model_input/X_test.csv

y_train:
  type: pandas.CSVDataset
  filepath: data/05_model_input/y_train.csv

y_test:
  type: pandas.CSVDataset
  filepath: data/05_model_input/y_test.csv

# --- 06 models ------------------------------------------------------------
modelo_baseline:
  type: pickle.PickleDataset
  filepath: data/06_models/modelo_baseline.pkl

modelo:
  type: pickle.PickleDataset
  filepath: data/06_models/modelo.pkl

modelo_asignacion:
  type: pickle.PickleDataset
  filepath: data/06_models/modelo_asignacion.pkl

# --- 07 model output ------------------------------------------------------
tabla_asignacion:
  type: pandas.CSVDataset
  filepath: data/07_model_output/tabla_asignacion.csv

# --- 08 reporting ---------------------------------------------------------
metricas:
  type: json.JSONDataset
  filepath: data/08_reporting/metricas.json

metricas_cv:
  type: json.JSONDataset
  filepath: data/08_reporting/metricas_cv.json

importancia_shap:
  type: pandas.CSVDataset
  filepath: data/08_reporting/importancia_shap.csv

efecto_tienda_shap:
  type: pandas.CSVDataset
  filepath: data/08_reporting/efecto_tienda_shap.csv

grafica_shap:
  type: matplotlib.MatplotlibDataset
  filepath: data/08_reporting/shap_importancia.png
  save_args:
    dpi: 200

comparacion_reglas:
  type: json.JSONDataset
  filepath: data/08_reporting/comparacion_reglas.json

ajuste_cuantilico:
  type: json.JSONDataset
  filepath: data/08_reporting/ajuste_cuantilico.json

costos_por_escenario:
  type: pandas.CSVDataset
  filepath: data/08_reporting/costos_por_escenario.csv

sensibilidad_costos:
  type: pandas.CSVDataset
  filepath: data/08_reporting/sensibilidad_costos.csv

grafica_asignacion:
  type: matplotlib.MatplotlibDataset
  filepath: data/08_reporting/asignacion_inventario.png
  save_args:
    dpi: 200
