analisis_brecha:
  # Debe estar en unidades: la brecha en Q se calcula como brecha en unidades × precio.
  target: Item_Units
  # Formato que define el "potencial": lo que vendería una tienda de este formato
  # con el mismo surtido. Type1 es el formato estándar (6 de las 10 tiendas).
  formato_referencia: Supermarket Type1
  # Solo atributos del producto: el potencial depende del surtido, no de la tienda.
  # La visibilidad se excluye porque la decide cada tienda.
  features_numericas:
    - Item_MRP
    - Item_Weight
  features_categoricas:
    - Item_Type
    - Item_Fat_Content
    - Item_Category
  # Niveles de agregación de la brecha.
  niveles_tienda:
    - Outlet_Identifier
    - Outlet_Type
    - Outlet_Size
    - Outlet_Location_Type
  niveles_formato:
    - Outlet_Type
  niveles_tienda_categoria:
    - Outlet_Identifier
    - Outlet_Type
    - Item_Type
